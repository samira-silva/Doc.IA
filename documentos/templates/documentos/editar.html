{% extends 'base.html' %}

{% block title %}Editar {{ documento.titulo }} - DocIA{% endblock %}

{% block content %}
    <h1>Editar documento</h1>
    <p class="meta">Enviar um novo arquivo apaga o resumo de IA anterior; será preciso analisar novamente.</p>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-block">Salvar</button>
    </form>

    <p style="margin-top: 1.5rem;">
        <a class="link-muted" href="{% url 'detalhe_documento' documento.pk %}">Cancelar</a>
    </p>
{% endblock %}
